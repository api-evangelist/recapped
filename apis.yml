aid: recapped
name: RecappED
description: 'RecappED (recapped.io) is an AI-powered digital sales room and customer
  onboarding platform for B2B revenue teams. It consolidates the buying and selling
  process into a single collaborative workspace with mutual action plans, deal
  management, buyer-engagement tracking, AI deal intelligence, an AI sales coach,
  and structured handoffs from sales to implementation. Integration with CRM and
  sales tooling is delivered through native connectors (Salesforce, HubSpot, Slack,
  Gong, Clari, Zoom) and Zapier rather than a public developer API; no OpenAPI,
  developer portal, or public REST reference is published. The platform announced it
  is shutting down on 2026-07-31 and is not accepting new customers. Surfaced as a
  CRV portfolio company and enriched into the API Evangelist network.'
