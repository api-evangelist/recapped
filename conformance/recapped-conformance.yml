method: searched
source: >-
  https://www.recapped.io/security (compliance section + AICPA SOC / GDPR / CCPA
  badge images), https://www.recapped.io/privacy (section 10, California
  residents / CCPA as amended by CPRA), plus live probes recorded in
  well-known/recapped-well-known.yml and security/recapped-domain-security.yml.
scope: >-
  Cross-cutting standards conformance for RecappED. RecappED publishes no API, so
  the API-shaped standards below (OAuth 2.0 as an authorization surface, OIDC
  discovery, RFC 9457, pagination, idempotency, webhook signing) are all recorded
  as not-conformant on the basis of a genuine absence — there is no contract in
  which they could be expressed. The compliance claims that ARE published are
  corporate/security-program claims, and they are unverified marketing assertions
  rather than published attestations: the security page says the reports are
  "available upon request, with an NDA in place".
