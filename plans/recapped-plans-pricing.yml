api_access:
  public_api: false
  note: >-
    No tier grants API access. Programmatic connectivity is sold as the Zapier
    integration (Integrate / Business tier and above) plus native Salesforce,
    HubSpot, Slack, Gong and Zoom connectors — not as a developer API. No pricing
    tier mentions an API key, quota, or rate limit.
