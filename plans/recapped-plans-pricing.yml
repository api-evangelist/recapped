description: >-
  RecappED prices the digital sales room product per seat and per team; there is
  no API plan, no developer tier and no usage-metered pricing, because RecappED
  publishes no public API. The pricing page renders two parallel tier sets — a
  per-user set (Free / Collaborate / Integrate / Automate) and a flat monthly set
  (Free / Team / Business / Enterprise) — and the feature comparison table below
  them uses a third set of labels (Free / Starter / Growth / Enterprise). Both
  published sets are recorded verbatim below rather than reconciled, because the
  provider does not reconcile them. NOTE: the site carries a sitewide banner
  reading "Unfortunately, after 7 long years Recapped is shutting down 7/31/2026
  and will not be taking on new customers" — these plans are still published but
  are not purchasable by a new customer.
