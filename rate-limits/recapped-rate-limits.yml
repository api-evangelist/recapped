note: >-
  An honest zero. RecappED publishes no public API, no developer portal and no
  API reference, so there are no request quotas, no rate-limit response headers
  and no documented throttling behavior to record. Every pricing tier is
  expressed in seats and features; not one names an API call quota. No pointer of
  type RateLimits is wired in apis.yml, because recording an absence must not be
  scored as a published rate-limit signal.
